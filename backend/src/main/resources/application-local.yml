spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/startrail_payment}
    username: ${DB_USERNAME:startrail}
    password: ${DB_PASSWORD:startrail_local}
  flyway:
    locations: classpath:db/migration,classpath:db/migration-local

startrail:
  simulator:
    enabled: true
  integration:
    inbound-secret: ${STARTRAIL_LOCAL_INBOUND_SECRET:local-only-change-me}
    outbound-secret: ${STARTRAIL_LOCAL_OUTBOUND_SECRET:local-only-change-me}

airwallex:
  environment: sandbox
  base-url: https://api.sandbox.airwallex.com/api/v1
  client-id: ${AIRWALLEX_CLIENT_ID:}
  api-key: ${AIRWALLEX_API_KEY:}
  webhook-secret: ${AIRWALLEX_WEBHOOK_SECRET:}
  checkout-country-code: ${AIRWALLEX_CHECKOUT_COUNTRY_CODE:}

server:
  address: 127.0.0.1
