spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/startrail_payment}
    username: ${DB_USERNAME:startrail}
    password: ${DB_PASSWORD:startrail_local}
  flyway:
    locations: classpath:db/migration,classpath:db/migration-local

startrail:
  simulator:
    enabled: true
  integration:
    inbound-secret: ${STARTRAIL_LOCAL_INBOUND_SECRET:local-only-change-me}
    refund-inbound-secret: ${STARTRAIL_LOCAL_REFUND_INBOUND_SECRET:local-only-refund-change-me}
    outbound-secret: ${STARTRAIL_LOCAL_OUTBOUND_SECRET:local-only-change-me}
    notification-url: http://127.0.0.1:8080/mock-xingzhe/api/v1/payment-events
    business-order-url-template: ${STARTRAIL_BUSINESS_ORDER_URL_TEMPLATE:http://localhost:5175/mock-xingzhe/order/{businessOrderId}}

payment:
  status-refresh:
    poll-delay-ms: ${PAYMENT_STATUS_REFRESH_POLL_DELAY_MS:10000}
  checkout:
    public-base-url: ${PAYMENT_CHECKOUT_PUBLIC_BASE_URL:http://localhost:5173}

airwallex:
  environment: sandbox
  base-url: https://api.sandbox.airwallex.com/api/v1
  client-id: ${AIRWALLEX_CLIENT_ID:}
  api-key: ${AIRWALLEX_API_KEY:}
  webhook-secret: ${AIRWALLEX_WEBHOOK_SECRET:}

operations:
  bootstrap:
    owner-username: ${OPERATOR_OWNER_USERNAME:owner}
    owner-password: ${OPERATOR_OWNER_PASSWORD:}
    staff-username: ${OPERATOR_STAFF_USERNAME:xingzhe-admin}
    staff-password: ${OPERATOR_STAFF_PASSWORD:}

server:
  address: 127.0.0.1

management:
  server:
    address: 127.0.0.1
