spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration

startrail:
  simulator:
    enabled: false
  integration:
    inbound-secret: ${STARTRAIL_INBOUND_SECRET}
    refund-inbound-secret: ${STARTRAIL_REFUND_INBOUND_SECRET}
    outbound-secret: ${STARTRAIL_OUTBOUND_SECRET}
    notification-url: ${STARTRAIL_PAYMENT_NOTIFICATION_URL}
    business-order-url-template: ${STARTRAIL_BUSINESS_ORDER_URL_TEMPLATE}

payment:
  status-refresh:
    poll-delay-ms: ${PAYMENT_STATUS_REFRESH_POLL_DELAY_MS:10000}
  checkout:
    public-base-url: ${PAYMENT_CHECKOUT_PUBLIC_BASE_URL}

airwallex:
  environment: prod
  base-url: https://api.airwallex.com/api/v1
  client-id: ${AIRWALLEX_CLIENT_ID}
  api-key: ${AIRWALLEX_API_KEY}
  webhook-secret: ${AIRWALLEX_WEBHOOK_SECRET}

operations:
  bootstrap:
    owner-username: ${OPERATOR_OWNER_USERNAME}
    owner-password: ${OPERATOR_OWNER_PASSWORD}
    staff-username: ${OPERATOR_STAFF_USERNAME}
    staff-password: ${OPERATOR_STAFF_PASSWORD}

server:
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
