services:
  postgres:
    image: postgres:18-alpine
    container_name: startrail-payment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: startrail_payment
      POSTGRES_USER: startrail
      POSTGRES_PASSWORD: ${DB_PASSWORD:-startrail_local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - startrail-payment-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startrail -d startrail_payment"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  startrail-payment-data:
